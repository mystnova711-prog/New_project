name: Free VPS (Static Address)

on:
  workflow_dispatch:
  schedule:
    # Runs exactly every 6 hours to prevent Github from banning you
    - cron: '0 */6 * * *'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          # Allow Password Authentication
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config

          # Restart SSH
          sudo service ssh restart || sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &
          sleep 3

          # Create users and passwords
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/ || true
          sudo chown -R vpsuser:vpsuser /home/vpsuser

      - name: Install and Connect Tailscale
        run: |
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Connect using your Secret Key
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-vps
          
          # Give it a few seconds to register on the network
          sleep 5
          
          # Grab your permanent Host Address
          TS_DNS=$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          
          # Write DIRECTLY to GitHub's UI Summary Page
          echo "### 🚀 Your STATIC VPS is Live!" >> $GITHUB_STEP_SUMMARY
          echo "Because you used Tailscale, this address and port will **NEVER** change." >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Termius Login Info:" >> $GITHUB_STEP_SUMMARY
          echo "- **Host:** \`$TS_DNS\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Port:** \`22\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Username:** \`vpsuser\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Password:** \`userpass\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Alive for 6 Hours
        run: sleep 21600
