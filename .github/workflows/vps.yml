name: Free VPS (bore – perfect)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup SSH and bore
        run: |
          # Start SSH
          sudo service ssh restart || sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &
          sleep 3

          # Set passwords and user
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Download bore pre-built (fast) – if fails, we build later
          if ! curl -L -f -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore; then
            echo "Pre-built bore download failed. Building from source..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env
            git clone https://github.com/ekzhang/bore.git
            cd bore
            cargo build --release
            sudo cp target/release/bore /usr/local/bin/bore
          else
            chmod +x bore
            sudo mv bore /usr/local/bin/bore
          fi
          bore --version

      - name: Expose SSH and print address
        run: |
          # Start bore, log to file
          bore local 22 --to bore.pub > bore.log 2>&1 &
          BORE_PID=$!
          echo "Bore PID: $BORE_PID"

          # Wait for the listening message (up to 20 seconds)
          PORT=""
          for i in {1..20}; do
            if grep -q 'listening at bore.pub' bore.log; then
              PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
              break
            fi
            sleep 1
          done

          if [ -z "$PORT" ]; then
            echo "ERROR: Bore did not start correctly. Log contents:"
            cat bore.log
            # Attempt to restart once
            echo "Restarting bore..."
            kill $BORE_PID 2>/dev/null || true
            bore local 22 --to bore.pub > bore.log 2>&1 &
            BORE_PID=$!
            sleep 10
            PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
            if [ -z "$PORT" ]; then
              echo "Still no port. Exiting."
              exit 1
            fi
          fi

          echo "=========================================="
          echo "SSH ADDRESS: bore.pub:$PORT"
          echo "=========================================="
          echo "Connect with Termius:"
          echo "  Host: bore.pub"
          echo "  Port: $PORT"
          echo "  Username: vpsuser"
          echo "  Password: userpass"
          echo "------------------------------------------"
          echo "Your repo is in /home/vpsuser/"
          echo "Save changes with: git add . && git commit -m 'save' && git push"
          echo "=========================================="

          # Keep the job alive
          wait $BORE_PID
