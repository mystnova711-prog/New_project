name: Free VPS (bore fixed)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH and bore
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget git vim htop tmux
          sudo service ssh start

          # Set passwords
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Download bore (latest version, v0.5.0)
          curl -L -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore
          chmod +x bore
          # Verify it's a valid binary
          file bore
          # Move to /usr/local/bin for easier use
          sudo mv bore /usr/local/bin/bore

      - name: Expose SSH via bore
        run: |
          # Start bore and log to a file
          bore local 22 --to bore.pub > bore.log 2>&1 &
          BORE_PID=$!
          sleep 5
          # If the process died, log the error
          if ! kill -0 $BORE_PID 2>/dev/null; then
            echo "Bore failed to start. Log:"
            cat bore.log
            exit 1
          fi
          # Extract port from log
          PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          if [ -z "$PORT" ]; then
            echo "Could not extract port. Waiting longer..."
            sleep 5
            PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          fi
          echo "=========================================="
          echo "SSH ADDRESS: bore.pub:$PORT"
          echo "=========================================="
          echo "Connect with Termius:"
          echo "  Host: bore.pub"
          echo "  Port: $PORT"
          echo "  Username: vpsuser"
          echo "  Password: userpass"
          echo ""
          echo "Your repo is in /home/vpsuser/"
          echo "Save changes with: git add . && git commit -m 'save' && git push"
          echo "=========================================="
          # Keep job alive
          wait $BORE_PID

      - name: Keep alive (fallback)
        run: while true; do sleep 3600; done
