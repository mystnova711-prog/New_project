name: Free VPS (bore from source – verbose)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH and build tools
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget git vim htop tmux build-essential
          sudo service ssh start
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

      - name: Build bore from source
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source ~/.cargo/env
          git clone https://github.com/ekzhang/bore.git
          cd bore
          cargo build --release
          sudo cp target/release/bore /usr/local/bin/bore
          /usr/local/bin/bore --version

      - name: Expose SSH via bore (with debug)
        run: |
          # Start bore in background and pipe all output to a file
          /usr/local/bin/bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          echo "Bore PID: $BORE_PID"
          # Wait for a few seconds
          sleep 10
          # Check if process is still alive
          if ! kill -0 $BORE_PID 2>/dev/null; then
            echo "Bore process died. Log contents:"
            cat bore.log
            exit 1
          fi
          # Dump the log
          echo "Current bore.log:"
          cat bore.log
          # Extract port from log
          PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          if [ -z "$PORT" ]; then
            # Wait a bit longer and try again
            echo "Port not found yet, waiting another 5 seconds..."
            sleep 5
            cat bore.log
            PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          fi
          if [ -z "$PORT" ]; then
            echo "ERROR: Could not extract port. Exiting."
            exit 1
          fi
          echo "=========================================="
          echo "SSH ADDRESS: bore.pub:$PORT"
          echo "=========================================="
          echo "Connect with Termius:"
          echo "  Host: bore.pub"
          echo "  Port: $PORT"
          echo "  Username: vpsuser"
          echo "  Password: userpass"
          echo "------------------------------------------"
          echo "Your repo is in /home/vpsuser/"
          echo "Save changes with: git add . && git commit -m 'save' && git push"
          echo "=========================================="
          # Keep the job alive
          wait $BORE_PID

      - name: Keep alive (fallback)
        run: while true; do sleep 3600; done
