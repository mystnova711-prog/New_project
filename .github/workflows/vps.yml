name: Free VPS (opentunnel.com)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH and opentunnel client
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget git vim htop tmux
          sudo service ssh start
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Download opentunnel client (Linux amd64)
          wget -q https://github.com/opentunnel/opentunnel/releases/latest/download/opentunnel-linux-amd64
          chmod +x opentunnel-linux-amd64
          sudo mv opentunnel-linux-amd64 /usr/local/bin/opentunnel

      - name: Expose SSH via opentunnel
        run: |
          # Run opentunnel in TCP mode, forwarding port 22
          opentunnel tcp 22 > tunnel.log 2>&1 &
          sleep 5
          # Extract the public address from the log (format: tcp://... or something)
          ADDR=$(grep -oP 'tcp://[^ ]+' tunnel.log | head -1 | sed 's/tcp:\/\///')
          if [ -z "$ADDR" ]; then
            # Try another pattern
            ADDR=$(grep -oP '[0-9a-z-]+\.opentunnel\.com:\d+' tunnel.log | head -1)
          fi
          echo "=========================================="
          echo "SSH ADDRESS: $ADDR"
          echo "=========================================="
          echo "Connect with Termius:"
          echo "  Host: $ADDR (or just the hostname part)"
          echo "  Port: (if included in ADDR, otherwise default 22)"
          echo "  Username: vpsuser"
          echo "  Password: userpass"
          echo "------------------------------------------"
          echo "Your repo is in /home/vpsuser/"
          echo "=========================================="
          wait
