- name: Expose SSH and print address
        run: |
          # Start bore tunnel
          bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          
          # Monitor the log to grab the correct port
          while true; do
            if grep -q 'listening at bore.pub' bore.log; then
              PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
              
              # Write to Console (just in case)
              echo "SSH ADDRESS: bore.pub:$PORT"
              
              # Write DIRECTLY to GitHub's UI Summary Page (Bypasses the buffer block)
              echo "### 🚀 Your Free VPS is Live!" >> $GITHUB_STEP_SUMMARY
              echo "**SSH Command:** \`ssh vpsuser@bore.pub -p $PORT\`" >> $GITHUB_STEP_SUMMARY
              echo "---" >> $GITHUB_STEP_SUMMARY
              echo "### 📱 Termius Login Info:" >> $GITHUB_STEP_SUMMARY
              echo "- **Host:** \`bore.pub\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Port:** \`$PORT\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Username:** \`vpsuser\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Password:** \`userpass\`" >> $GITHUB_STEP_SUMMARY
              
              break
            fi
            sleep 1
          done
          
          # Keep the job alive for 6 hours
          wait $BORE_PID
