name: Free VPS (bore – instant)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup SSH and bore
        run: |
          # Start SSH
          sudo service ssh restart || sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &
          sleep 3

          # User
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Download bore
          if ! curl -L -f -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore; then
            echo "Pre-built failed, building..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env
            git clone https://github.com/ekzhang/bore.git
            cd bore
            cargo build --release
            sudo cp target/release/bore /usr/local/bin/bore
          else
            chmod +x bore
            sudo mv bore /usr/local/bin/bore
          fi

      - name: Expose SSH and print address
        run: |
          # Start bore, pipe output to a file AND to stdout
          bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          # Use tail -f to monitor the log as it grows
          timeout 15s tail -f bore.log | while read line; do
            if echo "$line" | grep -q 'listening at bore.pub'; then
              PORT=$(echo "$line" | grep -oE 'listening at bore\.pub:[0-9]+' | cut -d: -f2)
              echo "=========================================="
              echo "SSH ADDRESS: bore.pub:$PORT"
              echo "=========================================="
              echo "Connect with Termius:"
              echo "  Host: bore.pub"
              echo "  Port: $PORT"
              echo "  Username: vpsuser"
              echo "  Password: userpass"
              echo "------------------------------------------"
              echo "Your repo is in /home/vpsuser/"
              echo "=========================================="
              # Kill the tail process (we already printed)
              pkill -P $$ tail
              break
            fi
          done
          # If we didn't get a port, fallback
          if [ -z "$PORT" ]; then
            echo "Bore didn't start. Killing and falling back to opentunnel..."
            kill $BORE_PID 2>/dev/null || true
            # Fallback opentunnel
            wget -q https://github.com/opentunnel/opentunnel/releases/latest/download/opentunnel-linux-amd64
            chmod +x opentunnel-linux-amd64
            sudo mv opentunnel-linux-amd64 /usr/local/bin/opentunnel
            opentunnel tcp 22 2>&1 | tee opentunnel.log &
            OPID=$!
            timeout 15s tail -f opentunnel.log | while read line; do
              if echo "$line" | grep -qE '[0-9a-z-]+\.opentunnel\.com:[0-9]+'; then
                ADDR=$(echo "$line" | grep -oE '[0-9a-z-]+\.opentunnel\.com:[0-9]+')
                echo "=========================================="
                echo "SSH ADDRESS: $ADDR"
                echo "=========================================="
                echo "Connect with Termius: $ADDR"
                echo "User: vpsuser, Pass: userpass"
                pkill -P $$ tail
                break
              fi
            done
            # Keep alive
            while true; do sleep 3600; done
          else
            # Keep bore alive
            wait $BORE_PID
          fi
