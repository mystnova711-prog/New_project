name: Free VPS (bore + fallback)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup SSH and tools
        run: |
          # Start SSH
          sudo service ssh restart || sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &
          sleep 3

          # Set user/pass
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Install bore and opentunnel (both)
          # bore
          curl -L -f -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore || {
            echo "Pre-built bore download failed. Building from source..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source ~/.cargo/env
            git clone https://github.com/ekzhang/bore.git
            cd bore
            cargo build --release
            sudo cp target/release/bore /usr/local/bin/bore
          }
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

          # opentunnel
          wget -q https://github.com/opentunnel/opentunnel/releases/latest/download/opentunnel-linux-amd64
          chmod +x opentunnel-linux-amd64
          sudo mv opentunnel-linux-amd64 /usr/local/bin/opentunnel

      - name: Expose SSH (bore with timeout, fallback to opentunnel)
        run: |
          # Try bore first with a 10-second timeout
          echo "Starting bore..."
          timeout 10s bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          sleep 12  # wait for bore to start (or timeout)
          PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
          if [ -n "$PORT" ]; then
            echo "=========================================="
            echo "SSH ADDRESS: bore.pub:$PORT"
            echo "=========================================="
            echo "Connect with Termius: bore.pub:$PORT"
            echo "User: vpsuser, Pass: userpass"
            wait $BORE_PID
          else
            echo "bore failed or timed out. Switching to opentunnel..."
            # Kill bore if still running
            kill $BORE_PID 2>/dev/null || true
            # Start opentunnel
            opentunnel tcp 22 2>&1 | tee opentunnel.log &
            OPID=$!
            sleep 10
            ADDR=$(grep -oE '[0-9a-z-]+\.opentunnel\.com:[0-9]+' opentunnel.log | head -1)
            if [ -n "$ADDR" ]; then
              echo "=========================================="
              echo "SSH ADDRESS: $ADDR"
              echo "=========================================="
              echo "Connect with Termius: $ADDR"
              echo "User: vpsuser, Pass: userpass"
              wait $OPID
            else
              echo "Both bore and opentunnel failed."
              cat opentunnel.log
              exit 1
            fi
          fi
