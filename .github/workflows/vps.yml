name: Free VPS (bore)

on:
  schedule:
    - cron: '*/5 * * * *'   # restart every 5 min to stay alive
  workflow_dispatch:        # manual start

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours max

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH, tools, and bore
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget jq git vim htop tmux
          sudo service ssh start
          echo "root:MyStrongPass123!" | sudo chpasswd

          # Create a non‑root user with the repo as home
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:UserPass456!" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Install bore (latest binary)
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.0/bore
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

      - name: Expose SSH via bore
        run: |
          # Start bore in background, capture output
          bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          sleep 5
          PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          if [ -z "$PORT" ]; then
            # Wait a bit longer if the port isn't captured yet
            sleep 3
            PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          fi
          echo "=========================================="
          echo "SSH ADDRESS: bore.pub:$PORT"
          echo "=========================================="
          echo "Log in as: vpsuser (or root) with the passwords above."
          # Keep the job alive (bore will keep running)
          wait $BORE_PID

      - name: Keep alive (fallback)
        run: while true; do sleep 3600; done
