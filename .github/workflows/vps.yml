name: Free VPS (bore)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup SSH and bore
        run: |
          # Install SSH server and basic tools
          sudo apt update
          sudo apt install -y openssh-server curl wget git vim htop tmux
          sudo service ssh start

          # Set root password (change it if you like)
          echo "root:rootpass" | sudo chpasswd

          # Create a non-root user (you'll use this)
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          # Copy repo contents to user's home
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Install bore from official release (works every time)
          curl -L -o bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

      - name: Expose SSH via bore
        run: |
          # Start bore in the background and capture output
          bore local 22 --to bore.pub 2>&1 | tee bore.log &
          sleep 5
          # Extract the port number from the log
          PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          if [ -z "$PORT" ]; then
            sleep 3
            PORT=$(grep -oP 'listening on bore\.pub:\K[0-9]+' bore.log | head -1)
          fi
          echo "=========================================="
          echo "SSH ADDRESS: bore.pub:$PORT"
          echo "=========================================="
          echo "Connect with Termius:"
          echo "  Host: bore.pub"
          echo "  Port: $PORT"
          echo "  Username: vpsuser"
          echo "  Password: userpass"
          echo "------------------------------------------"
          echo "Your repo is in /home/vpsuser/"
          echo "Save changes with: git add . && git commit -m 'save' && git push"
          echo "=========================================="
          # Keep the job alive (bore will continue running)
          wait

      - name: Keep alive (fallback)
        run: while true; do sleep 3600; done
