name: Free VPS (ngrok v3)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH, tools, and latest ngrok
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget jq git vim htop tmux
          sudo service ssh start
          echo "root:MyStrongPass123!" | sudo chpasswd

          # Add non-root user
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:UserPass456!" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Install latest ngrok v3
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
          unzip ngrok-v3-stable-linux-amd64.zip
          chmod +x ngrok
          sudo mv ngrok /usr/local/bin/ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Expose SSH via ngrok
        run: |
          ngrok tcp 22 --region=us &
          sleep 5
          echo "=========================================="
          echo "SSH ADDRESS:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "=========================================="
          echo "Log in as: vpsuser (or root) with the passwords above."

      - name: Keep alive
        run: while true; do sleep 3600; done
