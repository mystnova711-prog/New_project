name: Free VPS (bore – works)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup SSH and bore
        run: |
          # Start SSH
          sudo service ssh restart || sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &
          sleep 3

          # User
          echo "root:rootpass" | sudo chpasswd
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser 2>/dev/null || true
          echo "vpsuser:userpass" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

          # Install bore – pre-built binary (fast, reliable)
          wget -q -O bore https://github.com/ekzhang/bore/releases/download/v0.5.0/bore
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

      - name: Expose SSH and print address
        run: |
          # Start bore, pipe to file and stdout
          bore local 22 --to bore.pub 2>&1 | tee bore.log &
          BORE_PID=$!
          # Monitor the log for the listening message
          while true; do
            if grep -q 'listening at bore.pub' bore.log; then
              PORT=$(grep -oE 'listening at bore\.pub:[0-9]+' bore.log | head -1 | cut -d: -f2)
              echo "=========================================="
              echo "SSH ADDRESS: bore.pub:$PORT"
              echo "=========================================="
              echo "Connect with Termius:"
              echo "  Host: bore.pub"
              echo "  Port: $PORT"
              echo "  Username: vpsuser"
              echo "  Password: userpass"
              echo "------------------------------------------"
              echo "Your repo is in /home/vpsuser/"
              echo "=========================================="
              break
            fi
            sleep 1
          done
          # Keep the job alive
          wait $BORE_PID
