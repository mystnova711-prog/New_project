name: Free VPS

on:
  schedule:
    - cron: '*/5 * * * *'   # restart every 5 min → always alive
  workflow_dispatch:        # manual start

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6h max, but cron restarts earlier

    steps:
      - name: Checkout repo (your persistent workspace)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install SSH, ngrok, and common tools
        run: |
          sudo apt update
          sudo apt install -y openssh-server curl wget jq git vim htop tmux net-tools
          sudo service ssh start
          echo "root:MyStrongPass123!" | sudo chpasswd   # CHANGE THIS

          # Add a non-root user with the same home as the repo
          sudo useradd -m -d /home/vpsuser -s /bin/bash vpsuser
          echo "vpsuser:UserPass456!" | sudo chpasswd
          sudo usermod -aG sudo vpsuser
          # Copy repo contents to the user's home
          sudo cp -r . /home/vpsuser/
          sudo chown -R vpsuser:vpsuser /home/vpsuser

      - name: Expose SSH via ngrok
        run: |
          wget -q https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip ngrok-stable-linux-amd64.zip
          chmod +x ngrok
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ./ngrok tcp 22 --region=us &
          sleep 5
          echo "=========================================="
          echo "SSH ADDRESS:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "=========================================="
          echo "Log in as: vpsuser (or root) with the passwords above."

      - name: Keep alive (infinite loop)
        run: while true; do sleep 3600; done
